[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damp"
dynamic = ["version"]
description = "DAMP: разреженные коды, раскладка и цикл уровней на MNIST — по статье и её продолжению"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pillow", "torch", "torchvision", "rerun-sdk>=0.43", "matplotlib"]

[project.optional-dependencies]
fast = ["numba"]
docs = ["pdoc"]

[tool.setuptools.dynamic]
version = { attr = "damp.__version__" }

[tool.setuptools.packages.find]
where = ["system", "client"]
include = ["damp*", "damp_api*"]
