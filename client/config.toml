# ==============================================================================================================
# 9.1. Живой дашборд: рисуем цифру кистью, цикл показывает кусочки и кластеры всех уровней (вне статьи)
# ==============================================================================================================
[dashboard]
# Цикл дашборда учится как прогон стенда: DASHBOARD_TRAIN обучающих цифр MNIST с видами LADDER_TRAIN_VIEWS (§7.1.4),
# карта уровня до DASHBOARD_MAP_POINTS точек; класс читает линейный слой (§9.3) со штрафом DASHBOARD_LINEAR_DECAY —
# лучший на стенде 0.10.0 (1e-7: 81.1 % на 5 наборах по 100 цифр). Рисунок идёт через обученные уровни теми же
# классами, что картинка прогона (cycle/trained.py); рабочие файлы прогона — под DASHBOARD_FILE_PREFIX.
DASHBOARD_TRAIN = 100
# Предел карты: 10 000 точек — слово автора 2026-11-17 (было 5 000). Целиком на карту в 5 000 точек помещались
# окна ≈ 130 цифр (≈ 38 точек на цифру на уровнях 1–2), дальше шла выборка окон; на 10 000 — ≈ 260 цифр.
DASHBOARD_MAP_POINTS = 10000
DASHBOARD_LINEAR_DECAY = 1e-07
DASHBOARD_FILE_PREFIX = "data/dashboard/ladder"
# Кнопка «пример»: случайная цифра LADDER_FIGURE_DIGIT (пятёрка) из первых DASHBOARD_EXAMPLES картинок MNIST t10k,
# каждый раз другая; её номер в MNIST показывается.
DASHBOARD_EXAMPLES = 500
# Сервер страницы — только на этом компьютере.
DASHBOARD_HOST = "127.0.0.1"
DASHBOARD_PORT = 8765
# Кисть холста в пикселях поля 28×28: толщина штриха и гауссово размытие, как у цифр MNIST (подобраны в прошлом
# самодельном дашборде по 1000 обучающим цифрам: средняя толщина штриха 2.48 px, половина цифр — от 2.0 до 2.8 px).
# Рисунок ставится по центру масс в точку DASHBOARD_CENTRE, как цифры MNIST (рамка 20×20 в поле 28×28). Замер:
# средний центр масс 10 000 обучающих цифр MNIST — (14.50, 14.50) пикселя при центре пикселя i + 0.5, разброс 0.29.
DASHBOARD_BRUSH_WIDTH = 2.48
DASHBOARD_BRUSH_SIGMA = 0.55
DASHBOARD_CENTRE = 14.5
# Рабочие процессы сервера: в каждом свой обученный цикл, рисунки посреди штриха считаются параллельно, и страница
# обновляется чаще (запросы идут равномерно, столько сразу, сколько процессов готово). Задержка одного рисунка та
# же. Цена: каждый процесс загружает цикл из кеша шагов (поднимаются по одному в фоне, дашборд работает сразу) и
# занимает свою память и видеопамять. Последний рисунок штриха считает главный процесс — его итог идёт в журнал.
# 0 — без рабочих процессов: всё считает главный, по одному рисунку.
DASHBOARD_WORKERS = 3
# Что показывать. Кусочек зажигает сотни точек карты (на 100 цифрах — около 760 из 5 000, порог λ_a уровня): у каждого
# кусочка страница получает DASHBOARD_LIT_PER_PIECE сильнейших, у каждой точки — её сильнейшую активацию и сколько
# кусочков её зажгли. Срабатываний — десятки тысяч на уровень: жирно рисуются DASHBOARD_TOP_CLUSTERS кластеров, в
# которые набилось больше всего кусочков, остальные — тонко.
DASHBOARD_LIT_PER_PIECE = 40
DASHBOARD_TOP_CLUSTERS = 40
# У выбранного кусочка на карте — столько его сильнейших кластеров (он зажигает сотни). Точка карты светится, если её
# активация выше доли DASHBOARD_LIT_FLOOR диапазона «порог λ_a уровня … сильнейшая активация рисунка».
DASHBOARD_OWN_CLUSTERS = 12
DASHBOARD_LIT_FLOOR = 0.3

