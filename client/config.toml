# ==============================================================================================================
# 9. Рисунки: стиль, рисунки README, картинки детекторов, тест пинвила
# ==============================================================================================================
[figures]
# --- Тест MNIST-кодера: по 360 углов при двух позициях в сетке участков.
# Код Angle || X || Y и параметры раскладки общие с MNIST (§2.2.3, §4.6, §5).
#
# --- Визуализация первичных детекторов угла и позиции (detectors_visual.py): слои, рецептивные поля,
# их перекрытие и цветовые полосы бит (§4.1, §4.2.1, §3.2). Детекторы, активные для примера стимула
# (угол, X, Y), выделяются; остальные рисуются с прозрачностью DETECTORS_VIEW_INACTIVE_ALPHA.
#
# --- Общий стиль рисунков проекта (вне статьи): тёмный фон, цвета подписей и рядов данных, шрифты.
# Ряды данных — проверенная на различимость при нарушениях цветового зрения тройка (синий, оранжевый,
# бирюзовый); зелёный — окно внимания.
#
# --- Рисунки README (readme_figures.py): один прогон цикла с наблюдателем, тест пинвила и картинка детекторов.
# Прогон — те же 100 обучающих цифр (с видами LADDER_TRAIN_VIEWS — 500 обучающих картинок) и 500 проверочных с картой
# уровня до 5 000 точек, что в замерах README; без сдвинутых копий проверочных. Рабочие файлы прогона — в README_FIGURES_WORK_DIR, рисунки — в README_FIGURES_DIR.
