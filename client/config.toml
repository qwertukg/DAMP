# Настройки DAMP — всё, чем управляют нейросетью клиент, оператор и админ.
#
# Порядок — по значимости: сверху то, что сильнее всего меняет результат, внизу техника, которая меняет только
# скорость и память. Имя ключа — то же, что в коде (поиск по имени находит и настройку, и место, где она
# работает). Разделы [..] только группируют ключи, имена ключей уникальны во всём файле.
#
# Значения: "none" — нет значения (None); массив — кортеж; { smooth = …, article = … } — значение зависит от
# режима раскладки LAYOUT_SMOOTH_PINWHEELS (true — smooth, false — article). Ссылки в скобках — параграф статьи
# (§6.5) или раздел её продолжения (П.5). Читает файл system/damp/settings.py; другой файл — переменная
# окружения DAMP_CONFIG.

# ==============================================================================================================
# 1. Прогон: сколько цифр и что мерить (меняет результат сильнее всего)
# ==============================================================================================================
[run]
# Сколько цифр брать и как мерить. Замеры README: train 100, test 500, карта уровня до 5 000 точек.
# Обучающих цифр по умолчанию (ключ --count всех команд).
DECODER_DEFAULT_COUNT = 1000
# Проверочных цифр цикла по умолчанию (ключ --limit команды ladder; 0 — без проверки).
LADDER_EVALUATE_LIMIT = 2000
# Предел точек карты уровня; "none" — без предела. В замерах README — 5000 (быстрее вдвое, в пределах шума).
LADDER_MAP_MAX_POINTS = "none"
# Сколько картинок распознаёт predict без --image.
DECODER_DATASET_LIMIT = 64
# По скольким самым похожим обучающим примерам решать класс (§2.2.5); в README — по одному.
LADDER_NEIGHBOURS = [1, 5]
# Класс из памяти (§2.2.5, §7.1.13.3, §8.2; system/damp/decode/memory_votes.py): кусочек голосует цифрой своей самой
# активной точки памяти; ответ — цифра с наибольшей средней долей голосов по уровням, уверенность — согласие уровней.
# Замер 2026-11-17 (500 проверочных; 1 000 цифр с картой 10 000 точек и 5 000 цифр с картой 5 000): среднее долей по
# уровням 89.0 и 95.0 %, один верхний уровень 87.8 и 93.8 %, большинство среди ответов уровней 84.6 и 90.2 %,
# линейный читатель §9.3 — 92.4 и 95.6 %.
# Знание уровня (в ответ не входит, показывается рядом): порог — эта доля обучающих картинок (каждая без своих
# точек памяти) знает уровень хуже порога. Доработка: §7.1.13.3 велит отличать «знаю точно» от «собрано по
# частям» по уровням активации и содержимому активных точек, способа не задаёт.
RECOGNITION_KNOWLEDGE_QUANTILE = 0.05
# Сколько обучающих картинок идёт на мерку порога знания (равномерно по обучающим; каждая проходит цикл заново).
RECOGNITION_KNOWLEDGE_PICTURES = 100
# Проверка независимости от места: первые проверочные картинки ещё раз, сдвинутыми на (dy, dx) клеток.
LADDER_SHIFTS = [[1, 1], [2, 2], [4, 4], [8, 8]]
# Сколько проверочных картинок сдвигать.
LADDER_SHIFT_PICTURES = 500
# Зерно случайных бит детекторов (§4.2.1) и всех случайных выборов прогона.
ENCODER_RANDOM_SEED = 0

# ==============================================================================================================
# 1а. Протокол данных и стенд честного сравнения bench (вне статьи): DAMP, kNN по пикселям и CNN на одних картинках
# ==============================================================================================================
[bench]
# Выбор настроек идёт по отложенной выборке validation, а не по test: test смотрится один раз, в конце этапа.
# Картинки каждой группы — случайная выборка номеров MNIST с закреплённым зерном из своего пула, а не сплошной
# блок: MNIST train не перемешан по авторам, соседние блоки по 250 картинок заметно разной трудности (1-NN по
# пикселям на 500 обучающих — от 80 до 94 %, у блоков 59000–59249 и 59250–59499 — 94.4 и 85.6 %).
# Пулы номеров MNIST train, [начало, конец): обучающие наборы — из первого, отложенная выборка — из второго; не
# пересекаются. Проверочные test — случайная выборка из всего MNIST t10k.
BENCH_TRAIN_POOL = [0, 50000]
BENCH_VALIDATION_POOL = [50000, 60000]
# Зерно выборки номеров: одна выборка на стенд — те же картинки у всех методов и при повторе. Выборка устроена
# «префиксом»: 500 отложенных — начало выборки из 2000, набор s — тот же при любом числе наборов.
BENCH_SEED = 0
# Сколько картинок отложенной выборки по умолчанию: проверка — 1000, быстрая проверка — 100 (--validation 100).
BENCH_VALIDATION = 1000
# Какая доля отложенной выборки идёт на выбор настроек и раннюю остановку CNN (select); остаток (report) не
# участвует ни в каком выборе, по нему считается итоговая «validation» всех методов и разрыв до CNN.
BENCH_SELECT_SHARE = 0.5
# Обучающих картинок в одном наборе; наборы — случайные выборки из BENCH_TRAIN_POOL, не пересекаются между собой.
BENCH_TRAIN = 100
# Сколько обучающих наборов (повторов); итог — среднее, стандартное отклонение и 95 % интервал по наборам.
BENCH_SETS = 5
# Проверочных картинок из MNIST t10k; 0 — стенд смотрит только отложенную выборку, test остаётся нетронутым
# (финальный замер — 500 или весь t10k). Test считается только для настроек, выбранных по validation.
BENCH_TEST = 0
# Предел точек карты уровня у DAMP (как в замерах README).
BENCH_MAP_POINTS = 5000
# Методы стенда: "damp", "pixels" (kNN по пикселям), "cnn". По умолчанию только DAMP: эталоны — примерный
# ориентир, сняты один раз (CNN ≈ 86 % без аугментации и ≈ 91 % со сдвигами, kNN ≈ 70 % на 100 обучающих, README).
BENCH_METHODS = ["damp"]
# Соседей для голосования деталей DAMP и для kNN по пикселям; k выбирается по средней точности на select (часть
# отложенной выборки), report в выборе не участвует.
BENCH_NEIGHBOURS = [1, 3, 5, 9, 15]
# Нечёткий поиск §2.2.5 при голосовании деталей DAMP: деталь находит все детали обучающих с косинусом кода не ниже
# ε и отдаёт один голос, разделённый по их классам. Кандидаты ε выбираются по select вместе с k. Выключено: замер
# 2026-11-15 (1000 отложенных) — лучшее ε = 0.8–0.85 даёт 58.6–60.1 %, 1-NN — 68.1 % (−9.5 п.п. [−12.8; −6.3]);
# при малом ε голосуют общие штрихи, при большом у деталей нет соседей. 1-NN — та же окрестность с ε по ближайшему.
BENCH_EPSILONS = []
# Кандидаты «уровни k=…» (§7.1.12: «detector activity levels can also be used as an embedding»): окно верхнего
# уровня — вектор уровней активности детекторов в [0, 1], сходство — косинус, голосуют k ближайших окон.
BENCH_LEVEL_EMBEDDING = true
# Как уровни приводятся к [0, 1]: "clip" — min(E, 1) (кандидаты «уровни k=…»); "train_max" — деление на наибольший
# уровень детектора по обучающим окнам («уровни/max k=…», §9.3). Замер 2026-11-15 (1000 отложенных): train_max
# 69.4 % против 70.0 % у clip — разницы нет (−0.1 п.п. [−1.0; +0.9] на всей 1000), оставлен clip.
BENCH_LEVEL_SCALES = ["clip"]
# Кандидат «господство» (§8.2: «determine cluster dominance»): профиль детектора верхнего уровня — доли цифр точек
# карты в его поле (с весом энергии точки); окно голосует профилями сработавших детекторов с весом уровня активности.
# Выключено: замер 2026-11-15 (1000 отложенных) — 31.7 % против 70.0 % у «уровней k=1»: в поле детектора точки разных
# цифр, сумма профилей ~150 детекторов окна сглаживается к доле классов; в статье господство — для оценки и отладки.
BENCH_DOMINANCE = false
# Кандидаты «линейный λ=…» (§9.3: «Normalised activation levels of a detector hierarchy can be used as an embeddings
# in ℝⁿ … the output of a discrete model is fed as an input to a neural network»): эмбеддинг картинки — самые
# сильные уровни активации детекторов по её окнам на всех уровнях цикла, класс читает линейный слой с softmax,
# обученный на обучающих картинках; λ — штраф L2 на веса. [] — без этих кандидатов. Замер 2026-11-15 (стенд, 1000
# отложенных, 2 набора, с видами LADDER_TRAIN_VIEWS): λ = 1e-7 — 81.2 и 78.4 % против 76.0 и 72.4 % у «уровни k=3»
# (+5.6 п.п.); λ = 1e-8 — 79.3 %, 1e-6 — 78.5 %, 1e-5 — 77.2 %, 1e-4 — 72.4 %, 1e-3 и больше — хуже 56 %.
BENCH_LINEAR_DECAYS = [1e-08, 1e-07, 1e-06]
# Мерка устойчивости к деформации: первые BENCH_PIXEL_PICTURES картинок отложенной выборки, сдвинутые на
# BENCH_PIXEL_SHIFT пикселей (dy, dx); меряется, сколько ответов совпало с ответами на несдвинутые.
BENCH_PIXEL_PICTURES = 100
BENCH_PIXEL_SHIFT = [1, 1]
# Папка, куда стенд пишет итог bench-<время>.json (настройки, версия, номера картинок MNIST, все цифры).
BENCH_OUTPUT_DIR = "data/bench"
# --- Эталоны для честного сравнения (вне статьи): kNN по пикселям и обычная свёрточная сеть --------------------
# Те же обучающие картинки, те же отложенные validation; test эталоны не видят до конца.
# Соседей kNN по пикселям по умолчанию (PixelNearest.accuracy без ks; стенд передаёт BENCH_NEIGHBOURS).
BENCH_PIXEL_NEIGHBOURS = [1, 3, 5, 9, 15]
# Архитектуры CNN: "lenet5" (conv5x5 6, conv5x5 16, fc 120-84-10) и "wide" (conv3x3 32-32, conv3x3 64, fc 128-10).
BENCH_CNN_ARCHS = ["lenet5", "wide"]
# Перебор гиперпараметров CNN (архитектура x lr x weight decay x dropout); выбор — по средней точности validation.
BENCH_CNN_LR = [0.001]
BENCH_CNN_WEIGHT_DECAY = [0.0, 0.001]
# Dropout перед последним слоем.
BENCH_CNN_DROPOUT = [0.0, 0.5]
# Эпох не больше; ранняя остановка по точности validation, терпение — сколько эпох ждать улучшения; берутся веса лучшей эпохи.
BENCH_CNN_EPOCHS = 400
BENCH_CNN_PATIENCE = 60
BENCH_CNN_BATCH = 32
# Аугментация: "none" или "shifts" — случайный сдвиг на целое число пикселей в пределах +-BENCH_SHIFT_PIXELS
# (нулевое заполнение); тот же режим получит DAMP.
BENCH_SHIFT_PIXELS = 2
BENCH_AUGMENT = ["none", "shifts"]

# ==============================================================================================================
# 2. Цикл уровней (этап 6): окна, остановка, память уровня, детали
# ==============================================================================================================
[cycle]
# Цикл повторяет этапы 2–5 уровень за уровнем (§6.2, §6.6). Окно стоит на каждом элементе уровня (П.2), его
# радиус — по кластеру похожих соседей (§6.4.1–§6.4.3); окно растёт так, что окно на карте равно полю своей
# детали (рост в 2–2.5 раза за уровень, как от V1 к V2 и V4). Число уровней не задаётся: последний — первый,
# чьё окно видит почти всю цифру.
# Остановка: последний уровень — первый, чьё окно в среднем видит не меньше этой доли углопозиций цифры.
# 0.99 — ещё уровень 4, окно которого видит всю цифру (этап 4 плана): замер 2026-11-15 (1000 отложенных, 2 набора,
# с видами) — линейный читатель 82.4 и 79.2 % против 81.2 и 78.4 % (+1.0 п.п., в пределах шума), голоса деталей
# −8 п.п., прогон дольше на 15 %; оставлено 0.9.
LADDER_TOP_COVERAGE = 0.9
# Сколько понятий объединяет окно (П.7: «сочетание примерно пяти–семи понятий»): радиус окна не больше расстояния до
# этого по счёту ближайшего элемента (считая сам элемент); окна меньше — уровней больше. "none" — радиус только по
# кластеру похожих соседей (§6.4.3), в окне 9 / 16 / 43 элемента на уровнях 1–3. Замер 2026-11-15 (1000 отложенных,
# набор 1): 7 — семь уровней по 7–8 понятий, но 33.0 % против 72.8 %: детали почти все уникальны (не «ёмкие
# понятия»), соседи одного класса на картах ~17 % на всех уровнях — классы не собираются.
LADDER_KEYHOLE_CONCEPTS = "none"
# Сила штриха уровня 1 (вне статьи): «сильнейший» элемент круга места (пулинг "strongest") выбирается по силе
# края — модулю среднего градиента участка, нормированному внутри картинки, — а не по порядку обхода. false —
# прежнее поведение: силы всех штрихов равны 1. Замер этапа 0 (стенд bench, 5 наборов): с силой 65.1 %, без —
# 65.7 % на report, разность в пределах шума; оставлено — «сильнейший» по силе края осмысленнее порядка обхода.
LADDER_STROKE_STRENGTH = true
# Виды обучающих цифр (§7.1.4: слово берётся в нескольких разбиениях сразу, чтобы сходство не зависело от
# разбиения): каждая обучающая цифра ещё раз, сдвинутой на (dy, dx) пикселей, — штрихи попадают в другие клетки
# сетки (как микросаккады глаза). Виды — тоже обучающие: по ним строится память уровней и база распознавания;
# это аугментация сдвигами, поэтому DAMP с видами сравнивается с CNN со сдвигами (≈ 91 %). [] — без видов.
# Замер 2026-11-15 (стенд, 1000 отложенных, 2 набора): 4 вида на ±1 px — 75.6 и 72.4 % против 72.8 и 67.6 % без
# видов («уровни k=1», +3.8 п.п.); ответов, совпавших при сдвиге проверочной цифры на 1 px, 90 % против 78 %.
# 2026-11-17, автор: «убери пока сдвиг» — со штрихами-детекторами (относительные координаты) сдвиг на 1 px даёт
# почти те же штрихи, и виды, похоже, лишь повторяют коды окон (разных кодов в 3–4 раза меньше, чем окон).
# Было [[0, 1], [0, -1], [1, 0], [-1, 0]].
LADDER_TRAIN_VIEWS = []
# Нормировка уровня активации детектора. "none" — формула статьи §6.5: E(d) = Σ a·e / e_d (по нему выбираются σ
# сильнейших детекторов детали, считаются сила детали П.1 и пик отклика картинки). "train_max" — доработка вне
# статьи (§7.1.12 и §9.3 требуют лишь значений в [0, 1], способа не задают): E(d) делится на наибольший уровень
# этого детектора по окнам обучающих картинок и обрезается в [0, 1]. Замер этапа 0 (стенд bench, 5 наборов):
# train_max 65.1 %, none 64.5 % на report, разность в пределах шума — поэтому по умолчанию формула статьи.
LADDER_LEVEL_NORMALISATION = "none"
# Нижний предел радиуса окна — доля того, что видит одна деталь уровня (у углопозиций — доля шага между соседями).
# От него зависит рост поля за уровень: окно на уровнях выше первого почти всегда упирается в этот предел.
# П.3 говорит лишь «более крупную область». Подбор 2026-11-17 (стенд, 100 цифр; цель — доля соседей одной цифры
# на карте верхнего уровня): 1.5 — рост в 2.7 раза, 3 уровня, 0.548 на двух наборах; 1.0 — рост в 2.2 раза,
# 4 уровня, 0.534; 2.5 — 0.486 (окна крупные, мало точек); 0.5 — 0.32; 0.25 при остановке 0.99 — 6 уровней, 0.32.
# Чем меньше уровней до цифры целиком, тем чище верх.
LADDER_KEYHOLE_RADIUS_SHARE = 1.5
# Сколько похожих соседей должно быть в окне (§6.4.3; П.7: «пять–семь понятий»). 3 — хуже (48.2 %).
# Подбор 2026-11-17 по сходимости классов на карте последнего уровня (доля соседних точек той же цифры с РАЗНЫХ
# обучающих картинок; обученный цикл дашборда, карта до 5000 точек): 8 — 0.534 против 0.483 при 5 на 100 цифрах и
# 0.585 против 0.512 на 300 цифрах; рост на всех трёх уровнях. Было 5. Дальше не подбиралось.
LADDER_CLUSTER_MIN_POINTS = 8
# Пороги сходства слоёв при поиске кластера окна — квантили сходства кодов соседних элементов (§7.1.10).
LADDER_CLUSTER_SIMILARITY_QUANTILES = [0.75, 0.5, 0.25, 0.1, 0.0]
# Коды окон с косинусом не ниже этого сливаются к одному образцу перед раскладкой (§2.2.4).
LADDER_MERGE_SIMILARITY = 0.8
# То же для первичной карты углопозиций — «уровня 0» (system/damp/cycle/primary.py). Первичные коды соседних штрихов
# похожи куда сильнее кодов окон (широкие детекторы угла и места, §4.1): при 0.8 из 6 117 разных кодов 100 цифр
# оставалось 217 точек, и пинвилов на карте не было видно. 1.0 — сливаются только совпадающие коды.
LADDER_PRIMARY_MERGE_SIMILARITY = 1.0
# Слоёв детекторов над картой уровня (§7.1.10); пороги — равными шагами между квантилями сходств карты.
LADDER_HIERARCHY_LAYERS = 5
# Плотность кода детали (§2, §6.6).
LADDER_TARGET_DENSITY = 0.25
# Порог активации λ_a (§6.1); "none" — правило статьи: λ_a = порог нижнего слоя детекторов (§7.1.11).
LADDER_ACTIVATION_LAMBDA = "none"
# Порог λ_a квантилем сходств карты; "none" — правило статьи. Квантиль 0.90 дал 55.0 % против 63.4 %.
LADDER_ACTIVATION_QUANTILE = "none"
# Самая похожая точка карты зажигается всегда, даже ниже λ_a (наша добавка: иначе стимул не оставит следа).
LADDER_ACTIVATE_BEST = true
# Порог слияния кодов верхних деталей на карте классов.
LADDER_CLASS_MERGE_SIMILARITY = 0.9
# Порог λ раскладки карты уровня (§5.4, §7.1.7) — квантиль попарных сходств её кодов: та же доля похожих пар,
# что даёт первичным кодам λ = 0.65; верхний квантиль — как у λ = 0.8. По ним же — пороги слоёв детекторов.
LADDER_LAYOUT_LAMBDA_QUANTILE = 0.82
LADDER_LAYOUT_LAMBDA_MAX_QUANTILE = 0.982
# Предел числа образцов, когда предел карты LADDER_MAP_MAX_POINTS не задан.
LADDER_DICTIONARY_MAX = 1000000
# Шаг мест кодера места — доля радиуса окна.
LADDER_CLUSTER_PLACE_UNIT = 0.5
# Радиус активации r_a при поиске кластера окна, в шагах между соседними элементами (§6.4.1).
LADDER_CLUSTER_ACTIVATION_RADIUS = 6.0
# Свои пороги слоёв детекторов вместо квантилей; "none" — квантили.
LADDER_HIERARCHY_THRESHOLDS = "none"
# Сколько широких слоёв детекторов идёт в код детали (§3.3.2); "none" — все. Замер 2026-11-15 (1000 отложенных,
# 2 набора): 2 широких слоя — 63.0 и 56.4 % против 72.8 и 67.6 % (−10 п.п.): коды чаще общие (на карте уровня 3
# сливаются ~30 % окон), но общие не по цифре — соседей одного класса 35 % против 54 %.
LADDER_EMBEDDING_LAYERS = "none"
# Границы длины кода детали, бит.
LADDER_CODE_LENGTH_MIN = 64
LADDER_CODE_LENGTH_MAX = 8192
# Не больше скольких обучающих окон берётся для подбора длины кода окна (§6.6). Длина кода детали (границы выше)
# подбирается по всем окнам обучающих картинок уровня (по маске, не по порядку строк): проверочные окна на неё не влияют.
LADDER_CALIBRATION_SETS = 20000
# Карта меньше стольких точек уровня не даёт: цикл останавливается на предыдущем.
LADDER_MAP_MIN_POINTS = 16
# Торможение соседних деталей (доля поля); "none" — выключено. 0.5 и 0.25 дали 33.8 % и 26.0 %.
LADDER_INHIBITION_RADIUS = "none"
# Предохранитель: больше уровней не строится.
LADDER_CLUSTER_LEVELS = 12

# ==============================================================================================================
# 3. Код окна (этап 2 в цикле): детекторы места, маска, пулинг, плотность
# ==============================================================================================================
[keyhole_code]
# Код окна «что и где» (П.4–П.7): круги места (§4.3) добавляют свои биты места (OR) и вносят код элемента,
# переставленный своей маской. Пулинги: "strongest", "max", "min"; маски: "address", "bits".
# Слоёв кругов места (§4.3, §4.5): 2 — широкий 3 × 3 и узкий 9 × 9 (~20 вкладов на окно). 1 — только широкий слой:
# содержание окна — сильнейшие понятия 5–7 крупных областей (П.7), код окна 1280–2304 бита; замер 2026-11-15
# (1000 отложенных, 2 набора) — 59.6 и 54.2 % против 72.8 и 67.6 % (−13 п.п.): теряются мелкие места понятий.
# 3 — три масштаба мест (§4.5: широкий 3 × 3, средний 5 × 5, узкий 9 × 9): замер 2026-11-15 (те же 2 набора) — 65.0 и
# 66.8 % (−4.3 п.п.), ответов, совпавших при сдвиге на 1 px, 74 % против 78 %: код окна длиннее и дробнее.
LADDER_BINDING_PLACE_LAYERS = 2
# Радиус широкого слоя кругов места, в шагах мест. 1.5 — хуже (62.0 % против 65.2 %).
LADDER_BINDING_PLACE_RADIUS_MAX = 2.0
# Радиус узкого слоя.
LADDER_BINDING_PLACE_RADIUS_MIN = 0.75
# Перекрытие кругов места: место накрывают около 2.2 круга слоя.
LADDER_BINDING_PLACE_OVERLAP = 0.4
# Длина сегмента места в коде окна, бит.
LADDER_BINDING_PLACE_CODE_LENGTH = 256
# Пулинг круга места (П.5): "strongest" — сильнейший элемент области; "max" переполняет код (49.8 %).
LADDER_BINDING_POOLING = "strongest"
# Сколько понятий объединяет окно (П.7: «сочетание примерно пяти–семи понятий»; «отбрасывать … целые коды»): в
# содержание окна идут коды только этих самых сильных элементов окна, коды остальных отбрасываются целиком (биты
# места остаются у всех). "none" — все элементы окна. Замер 2026-11-15 (1000 отложенных, набор 1): 7 понятий —
# 42.6 % против 68.4 %: окно уровня 3 держит ~43 элемента, и 7 сильнейших цифру не описывают; П.7 предполагает окно,
# которое само охватывает 5–7 понятий, а не обрезку большого окна.
LADDER_BINDING_CONCEPTS = "none"
# Маска круга (П.5): "address" — бит i уходит в i ⊕ m; "bits" — буквальный XOR, насыщает код (10 %).
LADDER_BINDING_MASK = "address"
# Единиц в маске-векторе для "bits".
LADDER_BINDING_MASK_BITS = 8
# Средняя плотность кода окна: по ней подбирается длина содержания (степень двойки, §2).
LADDER_BINDING_TARGET_DENSITY = 0.2
# Предел бит одного окна (доля длины); лишние отбрасываются слиянием цветов (§3.3).
LADDER_BINDING_SATURATION = 0.25
# Наибольшая длина сегмента содержания, бит. Статья: один код — короткий вектор, 128–256 бит (§5.1.2), но простое
# укорочение до 2048 срезает биты: замер 2026-11-15 (1000 отложенных, 2 набора) — 57–60 % против 67–68 % (−9 п.п.).
# Короче — только через содержание из 5–7 понятий (П.7).
LADDER_BINDING_LENGTH_MAX = 4096
# Полуширина плоскости кругов места, в шагах мест.
LADDER_PLACE_EXTENT = 4.0

# ==============================================================================================================
# 4. Первичный кодер (этап 2): детекторы угла и позиции, длина и плотность кода
# ==============================================================================================================
[encoder]
# --- Первичное кодирование стимулов MNIST (угол, X, Y) по схеме Angle-Encoder:
# случайный бит цветовой полосы у каждого детектора, слои от самого широкого к самому узкому
# (§2.2.3, §3.2, §4.2.1, §4.4, §4.5).
# §2.2.3: коды координат можно слить в общий код той же длины (OR, §2.2.1) или склеить (конкатенация).
# True — общий код длины ENCODER_SHARED_CODE_LENGTH для угла и позиции; False — сегменты
# MNIST_ANGLE_CODE_LENGTH + 2·MNIST_POSITION_CODE_LENGTH.
#
ENCODER_SHARED_CODE = true
ENCODER_SHARED_CODE_LENGTH = 512
ENCODER_LAYER_PHASE = true
MNIST_ANGLE_IN_DEGREES = true
MNIST_ANGLE_MIN = 0.0
MNIST_ANGLE_MAX = 360.0
MNIST_ANGLE_CODE_LENGTH = 256
# Слоёв и перекрытия у угла и позиции поровну (10 слоёв, перекрытие 0.7): в режиме статьи
# (LAYOUT_SMOOTH_PINWHEELS = False) соседних ячеек, разнящихся по углу больше чем на 30° или по позиции больше
# чем на 3 окна, втрое меньше, чем при прежних 22 слоях и перекрытии 0.4 (300 цифр: 19.1 % → 5.5 %,
# 60 000 цифр: 1.21 % → 0.37 %). Перекрытие убирает стенки между областями, отношение слоёв угла и позиции
# решает, какая координата выходит непрерывной (§4.2.1, §4.5, §5.13.2.2). Цена: различных кодов на
# 60 000 цифр 256 тыс. вместо 456 тыс. Прежние значения оставлены в закомментированных строках.
# MNIST_ANGLE_LAYERS = 22
MNIST_ANGLE_LAYERS = 10
MNIST_ANGLE_WIDEST_DETECTORS = 2
MNIST_ANGLE_NARROWEST_DETECTORS = 180
# MNIST_ANGLE_OVERLAP = 0.4
MNIST_ANGLE_OVERLAP = 0.7
# Позиции MNIST — индексы участков 0…6. Нижняя граница вынесена на шаг за край данных: детекторов за краями
# отрезка нет (MNIST_POSITION_EDGE_DETECTORS = False), и при MIN = 0 участок 0 лежал на самой границе —
# 22 бита вместо ~34 и J(0, 1) = 0,81 при ~0,57 у остальных соседей. С MIN = -1 перекрытие соседних
# участков ровное (J = 0,55…0,61), их коды различимы одинаково (§4.2.1, §4.5).
MNIST_POSITION_MIN = -1.0
MNIST_POSITION_MAX = 28.0
MNIST_POSITION_CODE_LENGTH = 128
# 15 слоёв — минимальное уменьшение с 22, при котором в pinwheel-тесте (позиции 2×2, режим сглаживания)
# пропадает дыра на стыке четырёх позиций: соседние позиции достаточно похожи, чтобы точки на стыке
# получали энергию от чужих кластеров (22 слоя: 3–10 пустых ячеек в центре, 16: 0–5, 15: 1–2).
# MNIST_POSITION_LAYERS = 22
MNIST_POSITION_LAYERS = 10
MNIST_POSITION_WIDEST_DETECTORS = 2
# Самый узкий слой позиции — 28 детекторов (самый широкий — MNIST_POSITION_WIDEST_DETECTORS = 2);
# между ними слои растут геометрически, у каждого слоя своё число детекторов.
MNIST_POSITION_NARROWEST_DETECTORS = 28
# Перекрытие соседних позиционных детекторов слоя (§4.2.1: «detectors must overlap at each level»).
# MNIST_POSITION_OVERLAP = 0.4
MNIST_POSITION_OVERLAP = 0.7
# False — в слое ровно MNIST_POSITION_WIDEST…NARROWEST детекторов внутри отрезка (2 … 14), без детекторов
# за краями; True — детекторы заходят за концы отрезка, как в Angle-Encoder.
MNIST_POSITION_EDGE_DETECTORS = false
# Шаг сетки проверки дальнего порядка кодов позиций (§4.5), в клетках; сами места бывают дробными
# (MNIST_SUBCELL_POSITION), на коды и точность этот шаг не влияет.
MNIST_POSITION_STEP = 1.0

# ==============================================================================================================
# 5. Стимулы (этап 1): углопозиции MNIST
# ==============================================================================================================
[stimuli]
MNIST_GRAD_THRESHOLD = 0.05
# Сторона окна Собеля, по которому берётся углопозиция (вне статьи), — в пикселях картинки, на которой
# считается Собель: стимула 28×28 или, при MNIST_SOBEL_UPSCALE_ENABLED, увеличенной (28·MNIST_SOBEL_UPSCALE).
# Сетка окон — сторона // окно (без увеличения: 4 → 7×7, 3 → 9×9, 2 → 14×14; при ×8: 16 → 14×14, 3 → 74×74).
# Остаток у правого и нижнего края в окна не попадает. При 3 ядро 3×3 совпадает с окном, меньше 3 — захватывает
# соседей. X, Y углопозиции — индексы окон 0…сетка−1: диапазон MNIST_POSITION_MIN…MAX должен их покрывать.
# После смены пересоберите раскладку: python main.py layout --rebuild (кеш на другом окне не подхватится).
MNIST_PATCH_SIZE = 9   # при ×8: окно 9×9 увеличенных пикселей, сетка 224 // 9 = 24×24, X, Y ∈ 0…23
# True — углопозиции только по контуру цифры: окно берётся, если через него проходит контур (пиксель штриха
# ≥ MNIST_CONTOUR_LEVEL рядом с фоном), угол — по градиенту в пикселях контура. Залитая середина штриха и фон
# пропускаются, контур не рвётся на границах окон. False — прежний режим: средний градиент по всему окну.
MNIST_CONTOUR_ONLY = true
MNIST_CONTOUR_LEVEL = 0.5
# Окно даёт ровно одну углопозицию. Если края в окне смотрят в противоположные стороны (|Σg| / Σ|g| ниже
# порога — тонкий штрих целиком в окне), их градиенты гасили бы друг друга — берётся сильнейший край.
# 0.5 — наименьшая ошибка ориентации линий относительно контура на 1000 цифрах MNIST (0.3: 9.79°, 0.5: 9.58°,
# 0.7: 9.61°, 0.9: 9.63°). Линия толщиной в пиксель (градиент в её середине гасится) берётся по окну с кольцом
# соседних пикселей — на 3000 цифрах ни одного окна контура без углопозиции.
MNIST_CONTOUR_TWO_EDGE_COHERENCE = 0.5
# Дробное место углопозиции (вне статьи; только с MNIST_CONTOUR_ONLY): там, где край проходит внутри окна, —
# центр масс пикселей контура выбранного края с весом силы градиента (у линии в пиксель — по яркости), в единицах
# окна, точность ~1/8 пикселя MNIST. False — номер окна: наклонная линия ложится ступеньками по серединам окон
# (шаг окна 1.125 px). Проба 2026-11-16 по слову автора; проверяет сам автор на дашборде (100 цифр).
MNIST_SUBCELL_POSITION = true
# Штрихи детекторами над точками края, а не по сетке окон (замысел автора 2026-11-16; только с MNIST_CONTOUR_ONLY):
# место штриха задаёт детектор, найденный по самим точкам контура правилами §6.4 статьи, перенесёнными на картинку
# (доработка): в детектор идут только точки с похожим направлением градиента — один край линии при любой её толщине
# (§6.4.1), место — взвешенный центр (§6.4.2), центры не ближе шага (§6.4.5). Штрихи стоят в координатах самой цифры:
# сдвиг цифры сдвигает их вместе, наклонный край не режется сеткой. Места штрихов — в прежних единицах, клетках сетки
# MNIST_PATCH_SIZE. false — прежний способ: одна углопозиция на окно сетки.
MNIST_STROKE_DETECTORS = true
# Шаг штрихов — радиус поля детектора и наименьшее расстояние между центрами, пикселей увеличенной картинки.
# 6 — это 0.75 px картинки, две трети клетки сетки: столько же в среднем стояло между штрихами по сетке на наклонных
# краях. 9 — ровно клетка (1.125 px): штрихи реже, окна первого уровня шире (поле 3.1 клетки против 2.6 у сетки), и
# цикл складывался в 3 уровня вместо 4. Уменьшено по слову автора 2026-11-17: куски первого уровня были крупны.
# Проба 4 (0.5 px картинки) в тот же день: поле окна первого уровня 1.7 клетки против 2.3 при шаге 6, но пятна цифр на
# карте четвёртого уровня мельче, счёт в 1.4 раза дольше; автор вернул 6. Меньше 4 смысла нет: радиус окна упирается в
# нижний предел в клетку, а штрихи ближе полпикселя MNIST повторяют друг друга.
# Со штрихами по середине линии (MNIST_STROKE_MIDLINE, 2026-11-17) шаг 4: штрихов по середине вдвое меньше, чем по
# двум краям, и при шаге 6 верхняя карта редеет. Сходимость классов на последнем уровне (100 цифр, только соседи с
# других картинок): шаг 6 — 0.429, шаг 4 — 0.469, шаг 3 — 0.474. Для штрихов по двум краям прежнее значение — 6.
MNIST_STROKE_STEP = 4
# Похожее направление: косинус угла между градиентом точки и градиентом центра детектора не меньше этого (0.7 ≈ 45°).
MNIST_STROKE_SIMILARITY = 0.7
# По какому куску края читается угол штриха: полудлина куска в шагах штрихов (не меньше 1). Угол — направление суммы
# градиентов по куску; чем длиннее кусок, тем точнее (требование автора — 1–2°). Поля соседних детекторов перекрываются.
# 2.25 шага по 6 пикселей — те же 13.5 пикселя в каждую сторону, что были при шаге 9 и 1.5 шага; при шаге 4 это
# 3.375 шага.
MNIST_STROKE_ANGLE_SPAN = 3.375
# Наименьшее число точек края в поле детектора (n_d, §6.3): кусок края короче этого штриха не даёт.
MNIST_STROKE_MIN_POINTS = 3
# Плотный кандидат — точек в поле не меньше этой доли от медианы по картинке; плотные вставляются первыми (§6.4.5).
MNIST_STROKE_DENSE_SHARE = 0.8
# Полуширина окна, по которому складывается градиент вокруг точки края, пикселей увеличенной картинки: отклик
# Собеля лежит по обе стороны ступеньки, в одном пикселе направление грубое.
MNIST_STROKE_SMOOTHING = 2
# Штрихи по середине линии, а не по двум её краям (замысел автора 2026-11-17, ветка stroke-centerline; только с
# MNIST_STROKE_DETECTORS): «ходить не вдоль края штриха, а в точке касания ручки бумаги… мозгу не важна толщина
# штриха, ему важны его изгибы, перекрестия и прерывы». На вход тем же детекторам штрихов идут точки середины линии —
# гребень расстояния до края линии: точки, равноудалённые от двух её краёв (доработка, в статье и продолжении нет; в
# зрении — простые клетки-«полосы»). Чернила — пиксели не темнее MNIST_CONTOUR_LEVEL, как у контура. Направление
# штриха — без стрелки: угол 0…180°, круг кода угла — 180°; на перекрестии в одном месте стоят два штриха разного
# направления. Штрихов вдвое меньше, и толщина линии на них не влияет. false — штрихи по двум краям.
# Пробовали и отвергли (2026-11-17): гребень яркости — у жирной линии середина терялась; середины пар встречных
# точек края (идея автора) — линия ровнее, но стыки и перекрестия вырезаются: сходимость классов на последнем уровне
# 0.358 против 0.429 у гребня расстояния (100 цифр), хуже на всех трёх уровнях.
MNIST_STROKE_MIDLINE = true
# Сглаживание расстояния до края перед поиском гребня, пикселей исходной картинки (0.25 — два пикселя увеличенной):
# убирает зубцы от неровностей края, не сливая соседние линии.
MNIST_STROKE_MIDLINE_SIGMA = 0.25
# Точка — на гребне, если сила гребня (изгиб расстояния поперёк линии) не меньше этой доли от наибольшей на картинке.
# У расстояния до края наклон к середине один и тот же при любой толщине линии, поэтому порог от толщины не зависит;
# слабые гребни — отростки от неровностей края.
MNIST_STROKE_MIDLINE_STRENGTH = 0.3
# Линия, а не пятно: изгиб расстояния вдоль линии не больше этой доли изгиба поперёк. Меньше — рвутся изгибы линии,
# больше — у концов линий остаются «веера» лишних точек.
MNIST_STROKE_MIDLINE_BLOB = 0.6
# Не кончик: наклон расстояния вдоль линии не больше этой доли от (изгиб поперёк × сглаживание). Без условия гребень
# тянется «хвостом» от конца линии к её краю.
MNIST_STROKE_MIDLINE_TIP = 0.5
# Мостики через разрывы середины. Условия «не пятно» и «не кончик» рвут середину на перекрестиях и стыках линий: там
# расстояние до края — не гребень, а бугор. Куски соединяются путём по слабым точкам гребня — тем, что отброшены
# этими условиями или порогом силы (приём двух порогов, как у линий Стегера и краёв Кэнни). Слабая точка идёт в
# середину, только если лежит на пути между двумя кусками: «веер» у кончика линии примыкает к одному куску.
# Слабая точка — сила гребня не меньше этой доли от наибольшей на картинке (меньше MNIST_STROKE_MIDLINE_STRENGTH).
MNIST_STROKE_MIDLINE_WEAK = 0.1
# Наибольшая длина мостика, пикселей исходной картинки; 0 — разрывы не соединяются.
MNIST_STROKE_MIDLINE_BRIDGE = 6
# Предобработка перед Собелем как в process_image (Rust): увеличение ×MNIST_SOBEL_UPSCALE фильтром Lanczos3,
# контраст MNIST_SOBEL_CONTRAST (image::imageops::contrast: отклонение от середины × ((100 + c) / 100)²),
# Собель в целых числах. Контур и градиент ищутся на увеличенной картинке, окно MNIST_PATCH_SIZE — в её пикселях.
# Отсечка ±255 из оригинала (u8-каналы картинки) — только у картинок gx, gy в Rerun: углы считаются по полному
# отклику, иначе края с наклоном ~15…75° слипаются в 45° (на 1000 цифрах ошибка ориентации 13.6° против 8.9°).
# Увеличенная картинка и отклики gx, gy (красный — плюс, синий — минус) — в Rerun, MNIST_SOBEL_ENTITY_PATH.
# False — без предобработки; в digit_sketch.py и digits_contour_test.py переопределяется ключом --upscale.
MNIST_SOBEL_UPSCALE_ENABLED = true
MNIST_SOBEL_UPSCALE = 8
MNIST_SOBEL_CONTRAST = 100.0

# ==============================================================================================================
# 6. Раскладка (этап 3): режим, порог сходства, расписание фаз
# ==============================================================================================================
[layout]
# --- Раскладка (§5.4, §7.1.6, §7.1.7): cosine, порог λ с сигмоидой η,
# запас пустых ячеек ≈15%, дальняя энергия по всему пространству V (§5.5.1).
# Сглаживание пространства между пинвилами (расширение статьи): гауссово ядро дальней фазы, старт радиуса
# со всей карты, геометрическое убывание радиуса, фиксированный λ и слабый отжиг разворачивают соседние
# пинвилы друг к другу и убирают складки на их границах (docs/ARTICLE_COMPLIANCE.md).
# False — дальняя фаза строго по статье: φ = Σ s·d по всему V (§5.5.1), радиус пар линейно от d/2 к 1,
# триггер 1 % обменов и рост λ ступенями (§7.1.7), жадное правило обмена без отжига (§5.6).
#
LAYOUT_SMOOTH_PINWHEELS = true
LAYOUT_SIMILARITY = "cosine"
# Расстояние в парных энергиях: "euclidean" — d из §5.5, "squared" — d² без корня (§5.9.2).
LAYOUT_LONG_DISTANCE = "euclidean"
LAYOUT_SHORT_DISTANCE = "squared"
# Ядро дальней энергии: "distance" — φ = Σ s·d по §5.5.1; "gauss" — расширение статьи: ограниченное
# гауссово ядро окрестности радиуса r(t), r(t) следует за радиусом выбора пар (§7.1.7), не ниже минимума.
# Ограниченное ядро даёт гладкую карту из нескольких пинвилов с чередованием закрутки (как в V1).
LAYOUT_LONG_KERNEL = { smooth = "gauss", article = "distance" }
LAYOUT_LONG_KERNEL_RADIUS_MIN = 3
LAYOUT_LONG_KERNEL_WIDTH = 1.0   # σ гауссова ядра = width · r(t); при σ = r связь через границы кластеров сильнее
LAYOUT_LAMBDA_THRESHOLD = 0.65
# Крутизна сигмоиды порога (§5.4); None — жёсткий порог η = ∞, как в параметрах раскладки §7.1.7.
LAYOUT_ETA = { smooth = 10.0, article = "none" }
LAYOUT_EMPTY_RATIO = 0.15   # §7.1.6: запас пустых ячеек около 15 %; при 0.5 замер цикла не лучше (см. docs/ARTICLE_COMPLIANCE.md)
LAYOUT_RANDOM_SEED = 0
LAYOUT_LONG_PAIRS_PER_STEP = 24000
LAYOUT_LONG_STEPS = 14000
LAYOUT_SHORT_PAIRS_PER_STEP = 100
LAYOUT_SHORT_STEPS = 4000
LAYOUT_SHORT_LOCAL_RADIUS = 7
LAYOUT_SHORT_ENERGY_RADIUS = 7
LAYOUT_SHORT_ENERGY_RECALC_EVERY = 75
LAYOUT_SHORT_ENERGY_EPS = 1e-06
LAYOUT_SHORT_WEIGHTED_FIRST = true
LAYOUT_SHORT_PARTITIONS = 8
# Стартовый радиус выбора пар в долях стороны карты: 0.5 — d/2 по §7.1.7; 1.0 — вся карта,
# как начальная ширина окрестности в SOM (нужно гауссову ядру, иначе позиции распадаются на куски).
LAYOUT_ADAPTIVE_RADIUS_START_FACTOR = { smooth = 1.0, article = 0.5 }
# Расписание радиуса выбора пар: "swaps" — по статье, λ и r меняются, когда число обменов за шаг
# падает до LAYOUT_ADAPTIVE_SWAP_TRIGGER от начального значения этапа (§7.1.7); "geometric" и "linear" —
# расширение статьи: r убывает по номеру шага (геометрически в дальней фазе, линейно в ближней).
LAYOUT_ADAPTIVE_RADIUS_SCHEDULE = { smooth = "geometric", article = "swaps" }
LAYOUT_SHORT_ADAPTIVE_RADIUS_SCHEDULE = { smooth = "linear", article = "swaps" }
# Во сколько раз уменьшается r при срабатывании триггера (статья: «постепенно уменьшали до 1», §7.1.7).
LAYOUT_ADAPTIVE_RADIUS_TRIGGER_FACTOR = 0.5
# Окно шагов, по которому усредняется число обменов («обмены в единицу времени», §7.1.7).
LAYOUT_ADAPTIVE_SWAP_WINDOW = 10
# Отжиг в дальней фазе (расширение статьи): температура принятия невыгодных обменов в долях rms|Δ|
# на радиусах от LAYOUT_ANNEAL_RADIUS_MIN до LAYOUT_ANNEAL_RADIUS_MAX_FACTOR·d — масштаб, на котором
# соседние кластеры согласуют закрутку и фазу; снимает замёрзшие складки между кластерами.
# 0 — отжига нет, обмен только при выигрыше энергии (§5.6).
LAYOUT_ANNEAL_TEMPERATURE = { smooth = 0.1, article = 0.0 }
LAYOUT_ANNEAL_RADIUS_MAX_FACTOR = 0.4
LAYOUT_ANNEAL_RADIUS_MIN = 5
LAYOUT_ADAPTIVE_RADIUS_MIN = 1
# Триггер по доле обменов (1% от начальной, §7.1.7): 0 — расписание не ускоряется по обменам.
LAYOUT_ADAPTIVE_SWAP_TRIGGER = { smooth = 0.0, article = 0.01 }
# Рост λ ступенями до LAYOUT_ADAPTIVE_LAMBDA_MAX (§7.1.7); None — λ фиксирован: с гауссовым ядром
# рост λ ослабляет связь через границы кластеров и оставляет складки.
LAYOUT_ADAPTIVE_LAMBDA_STEP = { smooth = "none", article = 0.05 }
# λ поднимают с 0.65 до 0.8 (§7.1.7).
LAYOUT_ADAPTIVE_LAMBDA_MAX = 0.8
LAYOUT_SHORT_ADAPTIVE_RADIUS_FACTOR = 1.0
# Остановка (§5.6): число обменов за шаг ниже порога или качество Ē (§5.8) достигло заданного значения.
# Ē считается каждые LAYOUT_ENERGY_EVAL_EVERY шагов дальней фазы по всем точкам V с нормировкой на E_max по V
# (§5.7, §5.8); LAYOUT_ENERGY_TARGET = None — только по обменам.
LAYOUT_ENERGY_EVAL_EVERY = 200
# Радиус r_e энергии точки: одна матрица Ê для качества Ē (§5.8) и для детекторов (§6.3); «r_e ≤ 5 достаточно» (§5.7).
LAYOUT_ENERGY_RADIUS = 3
LAYOUT_ENERGY_TARGET = "none"
LAYOUT_MIN_SWAP_RATIO = 0.0001
LAYOUT_MIN_SWAP_WINDOW = 20
# Отдельный порог остановки ближней фазы (вне статьи): средняя доля обменов за LAYOUT_MIN_SWAP_WINDOW шагов,
# ниже которой фаза переходит к следующему этапу расписания радиуса, а на последнем — останавливается.
# С общим 0.0001 (меньше 0.2 обмена на шаг) ближняя фаза почти всегда идёт все шаги, хотя уже почти ничего не меняет:
# 100 цифр MNIST (окно 9, ×8, 8 693 точки) — доля обменов всю фазу 0.002…0.006, Ē после дальней фазы 0.69778;
# порог 0.005 → 20 шагов, 14 с, Ē 0.69787; 0.003 → 71 шаг, 45 с, Ē 0.69794; 0.0001 → 160 шагов, 93 с, Ē 0.69393.
# При LAYOUT_SMOOTH_PINWHEELS = False (расписание "swaps") порог сначала переводит фазу к следующему этапу r и λ.
LAYOUT_SHORT_MIN_SWAP_RATIO = 0.005
# §5.10: пары шага считаются спекулятивно по старым позициям; это не влияет на результат, пока обменов
# за шаг много меньше числа точек. В режиме статьи число пар за шаг (а значит, и обменов) ограничено
# долей LAYOUT_PAIRS_POINT_FRACTION от числа точек в обеих фазах; None — без ограничения (режим сглаживания,
# у которого расписание радиуса привязано к номеру шага и подобрано под прежний бюджет пар).
LAYOUT_PAIRS_POINT_FRACTION = { smooth = "none", article = 0.1 }
LAYOUT_TUNE_LONG_PAIR_FACTOR = 0.35
LAYOUT_TUNE_LONG_PAIRS_MIN = 4000
LAYOUT_TUNE_LONG_PAIRS_MAX = 20000
LAYOUT_TUNE_LONG_STEPS_DIVISOR = 25
# При сглаживании бюджет задаёт пошаговое расписание радиуса; по статье дальняя фаза заканчивается по числу
# обменов (§5.6), а при парах ≤ 0.1·N (§5.10) этапу §7.1.7 нужно ~10³ шагов независимо от N (каждая точка
# попадает в пару ~0.2 раза за шаг) — бюджет только верхняя граница.
LAYOUT_TUNE_LONG_STEPS_MIN = { smooth = 2500, article = 50000 }
LAYOUT_TUNE_LONG_STEPS_MAX = { smooth = 5000, article = 50000 }
LAYOUT_TUNE_LARGE_LONG_PAIR_FACTOR = 0.2
LAYOUT_TUNE_LARGE_SHORT_PAIR_FACTOR = 0.12
LAYOUT_TUNE_LARGE_SHORT_RADIUS_MAX = 31
LAYOUT_TUNE_LARGE_SHORT_ENERGY_RADIUS_MAX = 23
# Режим статьи, большие раскладки: радиус окрестности пары в ближней фазе — наименьший допустимый статьёй
# (§5.5.2: r ≥ ‖p1 − p2‖): r = max(⌈‖p1 − p2‖⌉ + 1, это значение); None — постоянный радиус фазы.
LAYOUT_TUNE_LARGE_SHORT_NEIGHBOURHOOD_MIN = 5
LAYOUT_TUNE_SHORT_PAIR_FACTOR = 0.2
LAYOUT_TUNE_SHORT_PAIRS_MIN = 1800
LAYOUT_TUNE_SHORT_PAIRS_MAX = 12000
LAYOUT_TUNE_SHORT_STEPS_FACTOR = 1.6
# При сглаживании радиус ближней фазы убывает по номеру шага, и бюджет задаёт расписание; по статье фаза
# заканчивается по числу обменов (§5.6), и бюджет — только верхняя граница, которой должно хватить на r → 1.
LAYOUT_TUNE_SHORT_STEPS_MIN = { smooth = 160, article = 2500 }
LAYOUT_TUNE_SHORT_STEPS_MAX = { smooth = 900, article = 5000 }
LAYOUT_TUNE_SHORT_RADIUS_FACTOR = 0.08
LAYOUT_SHORT_LOCAL_RADIUS_MIN = 3
LAYOUT_TUNE_SHORT_ENERGY_RADIUS_FACTOR = 0.06
LAYOUT_TUNE_SHORT_ENERGY_RECALC_FLOOR = 30

# ==============================================================================================================
# 7. Детекторы и активации (этап 4)
# ==============================================================================================================
[activation]
# --- Детекторная иерархия (§6.3–§6.5, §7.1.10, §7.1.12). Порог активации λ_a
# равен порогу нижнего слоя детекторов (§7.1.11); размер и насыщенность
# выходного кода вычисляются по среднему числу активных детекторов (§6.6).
#
ACTIVATION_LAMBDA_THRESHOLD = 0.7
ACTIVATION_ETA = "none"
ACTIVATION_ENERGY_THRESHOLD = 0.12
# Порог μ_a энергии активации точки (расширение статьи; автор 2026-11-17: «надо учитывать»). Энергия точки §5.7,
# где вместо сходства с соседями — их активация: Ê_a(j) = Σ a_v / d по соседям в радиусе r_e (LAYOUT_ENERGY_RADIUS),
# делённая на наибольшую по карте для того же стимула. Точка с Ê_a ниже порога в детекторы не идёт: одиночные
# зажжённые точки на отшибе молчат, пятна остаются. Энергия e_j из §6.5 — неподвижная энергия раскладки и их не
# гасит. Применяется в детекторах уровней цикла и в дашборде. 0 — выключено (как в статье).
# Подбор 2026-11-17 (стенд, 100 цифр, без видов; соседи одной цифры на верхней карте): 0 — 0.493, 0.1 — 0.512,
# 0.2 — 0.539, 0.35 — 0.549, 0.5 — 0.555, 0.7 — 0.546; вершина параболы ≈ 0.5, от 0.35 до 0.7 — плато.
ACTIVATION_LOCAL_ENERGY_THRESHOLD = 0.5
ACTIVATION_DETECTOR_THRESHOLD = 0.5
ACTIVATION_OUTPUT_BITS = 256
ACTIVATION_SATURATION_LIMIT = 50
ACTIVATION_MAX_EMBEDDING_DENSITY = 0.25
ACTIVATION_SATURATION_MIN = 16
ACTIVATION_SATURATION_MAX = 128
ACTIVATION_OUTPUT_CALIBRATION_SAMPLES = 100
ACTIVATION_DETECTOR_RADIUS_MIN = 1
# Слои иерархии (§7.1.10): порог λ_d, радиус активации r_a как доля стороны
# карты (нижние слои — области и гиперкластеры, верхние — кластеры и секторы)
# и минимальное число точек кластера.
ACTIVATION_DETECTOR_LAYER_SPECS = [[0.7, 0.35, 12], [0.75, 0.28, 10], [0.8, 0.22, 8], [0.85, 0.16, 6], [0.9, 0.12, 4]]
ACTIVATION_DETECTOR_ATTEMPTS_WITHOUT_CHANGE = 400
ACTIVATION_DETECTOR_SEED = 0
ACTIVATION_DBSCAN_EPS = 1.5
ACTIVATION_DBSCAN_MIN_SAMPLES = 3

