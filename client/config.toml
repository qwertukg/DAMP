# --- Проверка, как цифра строится из углопозиций (digit_sketch.py): случайный стимул MNIST заданной цифры,
# его углопозиции (угол, X, Y) от того же MnistSobelAngleMap, что и в конвейере (§4.4, §4.6), и по каждой —
